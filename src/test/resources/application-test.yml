spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

minio:
  endpoint: http://localhost:9000
  access-key: test
  secret-key: test
  bucket: test-bucket
  presigned-url-expiry-minutes: 10

jwt:
  secret: local-test-secret-key-must-be-at-least-32-bytes-long
  access-token-expiration: 1800000      # 30분
  refresh-token-expiration: 604800000   # 7일
  signup-token-expiration: 600000       # 10분

oauth:
  kakao:
    client-id: test-kakao-client-id
    client-secret: test-kakao-client-secret
    allowed-redirect-uris:
      - http://localhost:8080/test.html
      - http://localhost:5173/oauth/kakao/callback
    token-url: https://kauth.kakao.com/oauth/token
    user-info-url: https://kapi.kakao.com/v2/user/me
