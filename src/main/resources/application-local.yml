spring:
  application:
    name: goyo

  datasource:
    url: jdbc:postgresql://localhost:5432/goyodb
    username: goyo
    password: goyo1234
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: goyo-hikari-pool
      minimum-idle: 10
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 300000

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000      # 30분
  refresh-token-expiration: 604800000   # 7일
  signup-token-expiration: 600000       # 10분

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: goyo-local
  presigned-url-expiry-minutes: 10
  public-url-base: http://localhost:9000/goyo-local

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/test.html}
    allowed-redirect-uris:
      - http://localhost:5173/oauth/kakao/callback
      - http://localhost:8080/test.html
    token-url: https://kauth.kakao.com/oauth/token
    user-info-url: https://kapi.kakao.com/v2/user/me
