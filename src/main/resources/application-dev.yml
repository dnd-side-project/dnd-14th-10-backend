spring:
  application:
    name: gojak

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gojakdb}
    username: ${SPRING_DATASOURCE_USERNAME:gojak}
    password: ${SPRING_DATASOURCE_PASSWORD:gojak1234}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: gojak-hikari-pool
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 300000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false