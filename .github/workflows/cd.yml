name: Backend Dev CD

on:
  push:
    branches: [ develop, chore/9-cicd-setup ]

jobs:
  build:
    name: 빌드 및 Docker 이미지 푸시
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드
        run: ./gradlew clean build -x test

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 메타데이터 추출
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/gojak-backend
          tags: |
            type=raw,value=latest

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/gojak-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/gojak-backend:buildcache,mode=max

  deploy:
    name: 서버 배포
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/apps/gojak

            echo "배포 시작..."

            # 최신 이미지 Pull
            sudo docker-compose -f docker-compose.dev.yml pull app
            
            sudo docker-compose -f docker-compose.dev.yml up -d --no-deps app

            # 서버 시작 대기
            sleep 30

            # 사용하지 않는 이미지 정리
            sudo docker image prune -f

            echo "배포 완료!"

      - name: 배포 결과 알림
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "배포 완료"
            echo "Time: $(date)"
            echo "Commit: ${{ github.sha }}"
          else
            echo "배포 실패"
          fi