name: Backend CI

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 및 테스트 실행
        run: ./gradlew build
        env:
          JWT_SECRET: test-secret-key-for-ci-at-least-32-chars
          KAKAO_CLIENT_ID: test-kakao-client-id
          KAKAO_CLIENT_SECRET: test-kakao-client-secret

      - name: 테스트 결과 리포트
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: 테스트 결과
          path: 'build/test-results/test/*.xml'
          reporter: java-junit
          fail-on-error: true
          token: ${{ secrets.GITHUB_TOKEN }}
